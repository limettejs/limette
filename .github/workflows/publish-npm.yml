name: Publish npm

on:
  release:
    types: [published]

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  classify-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package: ${{ steps.classify.outputs.package }}
      workspace: ${{ steps.classify.outputs.workspace }}
      version: ${{ steps.classify.outputs.version }}
    steps:
      - name: Classify release tag
        id: classify
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFile } from 'node:fs/promises';

          const tag = process.env.RELEASE_TAG ?? '';
          const semver = '(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)' +
            '(?:-[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?' +
            '(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?';
          const limetteMatch = tag.match(new RegExp(`^${semver}$`));
          const createLimetteMatch = tag.match(
            new RegExp(`^create-limette@(${semver})$`),
          );

          let packageName = 'none';
          let workspace = '';
          let version = '';
          if (limetteMatch) {
            packageName = 'limette';
            workspace = 'limette';
            version = tag;
          } else if (createLimetteMatch) {
            packageName = 'create-limette';
            workspace = 'create-limette';
            version = tag.slice('create-limette@'.length);
          }

          await appendFile(
            process.env.GITHUB_OUTPUT,
            `package=${packageName}\nworkspace=${workspace}\nversion=${version}\n`,
          );
          console.log(`Classified ${JSON.stringify(tag)} as ${packageName}.`);
          EOF

  publish-limette:
    needs: classify-release
    if: ${{ needs.classify-release.outputs.package == 'limette' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate package and release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';

          const packageJson = JSON.parse(
            await readFile('packages/limette/package.json', 'utf8'),
          );
          const expectedTag = `${packageJson.version}`;

          if (packageJson.name !== 'limette') {
            throw new Error(
              `Expected package name "limette", received ${JSON.stringify(packageJson.name)}.`,
            );
          }

          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(
              `Release tag ${JSON.stringify(process.env.RELEASE_TAG)} does not match ${expectedTag}.`,
            );
          }
          EOF

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release
        run: npm run test:release

      - name: Publish to npm
        run: npm publish --workspace=limette --provenance --access public

  publish-create-limette:
    needs: classify-release
    if: ${{ needs.classify-release.outputs.package == 'create-limette' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate package and release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';

          const packageJson = JSON.parse(
            await readFile('packages/create-limette/package.json', 'utf8'),
          );
          const expectedTag = `create-limette@${packageJson.version}`;

          if (packageJson.name !== 'create-limette') {
            throw new Error(
              `Expected package name "create-limette", received ${JSON.stringify(packageJson.name)}.`,
            );
          }

          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(
              `Release tag ${JSON.stringify(process.env.RELEASE_TAG)} does not match ${expectedTag}.`,
            );
          }
          EOF

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release
        run: npm run test:release

      - name: Publish to npm
        run: npm publish --workspace=create-limette --provenance --access public
